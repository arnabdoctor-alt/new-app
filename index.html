<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Operative Logbook – Dr. Arnab Karmakar</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--tx:#14202b;--mu:#5d6b78;--bd:#dbe2e8;--ac:#0b3d91;--ac2:#e6edfa;--dg:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--card:#18222b;--tx:#e8eef3;--mu:#97a6b3;--bd:#2b3946;--ac:#7fa8ff;--ac2:#17274a;--dg:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161c;--card:#18222b;--tx:#e8eef3;--mu:#97a6b3;--bd:#2b3946;--ac:#7fa8ff;--ac2:#17274a;--dg:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 0;max-width:1100px;margin:auto}
.br{display:flex;align-items:center;gap:12px}.br img{width:52px;height:52px;border-radius:10px;background:#eee;flex:none}
h1{font-size:20px;margin:0}h1 small{display:block;font-size:12px;color:var(--mu);font-weight:400}
nav{display:flex;gap:6px;max-width:1100px;margin:10px auto 0;padding:0 16px;overflow-x:auto}
nav button{flex:1;min-width:max-content}
main{max-width:1100px;margin:auto;padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);min-height:42px}
button{padding:10px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer;min-height:42px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
nav button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
button.d{color:var(--dg)}
.stat{background:var(--ac2);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:24px;color:var(--ac)}.stat span{font-size:12px;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bar i{display:block;height:10px;background:var(--ac);border-radius:5px;min-width:3px}
.bar span:first-child{width:130px;flex:none}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:600;white-space:nowrap}
tr.c{cursor:pointer}tr.c:hover{background:var(--ac2)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:11px;margin:1px}
.mu{color:var(--mu);font-size:12px}h2{font-size:16px;margin:0 0 10px}
.hide{display:none}
</style></head><body>

<script>
const CATS={
"Trauma":["ORIF – long bone","ORIF – upper limb plating","Hip fracture fixation (DHS/PFN)","Hip fracture hemiarthroplasty","Pelvis/acetabulum fixation","External fixator","CRPP / K-wire","Debridement / fasciotomy","Implant removal","Other"],
"Arthroscopy":["Diagnostic arthroscopy","ACL reconstruction","PCL / multiligament","Meniscus repair / meniscectomy","Cartilage procedure","Ankle arthroscopy","Hip arthroscopy","Elbow / wrist arthroscopy","Other"],
"Shoulder":["Rotator cuff repair","Bankart / Latarjet","SLAP / biceps tenodesis","Shoulder arthroplasty (TSA / reverse)","Frozen shoulder release","Proximal humerus ORIF","ACJ / clavicle fixation","Other"],
"Knee":["Primary TKR","Unicompartmental KR","Revision TKR","High tibial osteotomy","Patellofemoral / patella procedure","Knee ligament surgery (open)","Other"],
"Hip arthroplasty":["Primary THR","Revision THR","Bipolar / hemiarthroplasty","Resurfacing","Periprosthetic fracture fixation","Other"],
"Reconstruction":["Nonunion / bone grafting","Deformity correction / osteotomy","Limb lengthening / Ilizarov","Tendon transfer / repair","Nerve / soft tissue reconstruction","Tumour / bone defect reconstruction","Other"],
"Other":["Other"]};
const TECH=["Open","Arthroscopic","Robotic","Navigation","Percutaneous / closed","MIS"];
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts=(a,all)=>(all?`<option value="">${all}</option>`:"")+a.map(x=>`<option>${esc(x)}</option>`).join("");
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date()),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
let entries=[],editId=null,pending=[],assets=null,store=null,ready=false;

/* ---- storage: IndexedDB on the device (entries + attached files) ---- */
let dbh;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("oplog",1);r.onupgradeneeded=()=>r.result.createObjectStore("e",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(m,fn)=>new Promise((res,rej)=>{const t=dbh.transaction("e",m);const q=fn(t.objectStore("e"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
async function initStore(){
 try{dbh=await idb()}catch(e){$("msg").textContent="Storage unavailable on this device";return}
 entries=await tx("readonly",s=>s.getAll());ready=true;
 store={set:async e=>{await tx("readwrite",s=>s.put(e));const i=entries.findIndex(x=>x.id===e.id);i<0?entries.push(e):entries[i]=e;render()},del:async id=>{await tx("readwrite",s=>s.delete(id));entries=entries.filter(x=>x.id!==id);render()}};
 assets={upload:async f=>({id:"f"+Date.now()+Math.random().toString(36).slice(2,6),blob:f})};
 $("stor").textContent="Entries and attached files are stored on this phone only. Use “Download full backup” regularly (the backup holds entry details, not attached files).";
 render();
}

/* ---- form ---- */
function fillProc(){$("proc").innerHTML=opts(CATS[$("cat").value])}
function clearForm(){editId=null;pending=[];["pname","age","sex","hid","ph","dx","notes"].forEach(i=>$(i).value="");$("date").value=today();$("files").value="";$("ftitle").textContent="New operative entry";$("save").textContent="Save entry";showFiles()}
function showFiles(){$("curfiles").innerHTML=pending.map((f,i)=>`<span class="tag">${esc(f.name)} <a href="#" data-rm="${i}">✕</a></span>`).join(" ")}
$("curfiles").onclick=e=>{const r=e.target.dataset.rm;if(r!=null){e.preventDefault();pending.splice(+r,1);showFiles()}};
$("cat").onchange=fillProc;$("clr").onclick=clearForm;
$("save").onclick=async()=>{
 if(!ready){$("msg").textContent="Still loading…";return}
 const msg=$("msg");msg.textContent="Saving…";
 const fl=$("files").files;
 if(fl.length&&assets){for(const f of fl){try{const r=await assets.upload(f);pending.push({id:r.id,name:f.name,blob:r.blob})}catch(e){msg.textContent="Upload failed for "+f.name;return}}}
 const e={id:editId||("e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),date:$("date").value||today(),cat:$("cat").value,proc:$("proc").value,tech:$("tech").value,side:$("side").value,role:$("role").value,name:$("pname").value.trim(),age:$("age").value,sex:$("sex").value,hid:$("hid").value.trim(),ph:$("ph").value.trim(),dx:$("dx").value.trim(),notes:$("notes").value.trim(),files:pending,ts:Date.now()};
 try{await store.set(e);msg.textContent="Saved ✓";const keep=[e.date,e.cat,e.proc,e.tech];clearForm();$("date").value=keep[0];setTimeout(()=>msg.textContent="",2500);if(store.local===undefined)render()}catch(x){msg.textContent="Could not save: "+(x.message||x.code)}
};
function edit(id){const e=entries.find(x=>x.id===id);if(!e)return;editId=id;pending=[...(e.files||[])];
 $("date").value=e.date;$("cat").value=e.cat;fillProc();$("proc").value=e.proc;$("tech").value=e.tech;$("side").value=e.side;$("role").value=e.role;
 $("pname").value=e.name;$("age").value=e.age;$("sex").value=e.sex;$("hid").value=e.hid;$("ph").value=e.ph;$("dx").value=e.dx;$("notes").value=e.notes;
 $("ftitle").textContent="Editing entry";$("save").textContent="Update entry";showFiles();tab("add");scrollTo(0,0)}
async function del(id){if(confirm("Delete this entry permanently?"))await store.del(id)}

/* ---- tables ---- */
function rowsHtml(list,withDel){
 if(!list.length)return'<tr><td class="mu">No entries.</td></tr>';
 return'<tr><th>Date</th><th>Patient</th><th>Procedure</th><th>Side</th><th>Files</th><th></th></tr>'+list.map(e=>`<tr class="c" data-id="${esc(e.id)}"><td>${esc(e.date)}</td><td>${esc(e.name||"—")}<div class="mu">${esc([e.age&&e.age+"y",e.sex,e.hid].filter(Boolean).join(" · "))}</div></td><td>${esc(e.proc)}<div><span class="tag">${esc(e.cat)}</span><span class="tag">${esc(e.tech)}</span></div><div class="mu">${esc(e.dx)}</div></td><td>${esc(e.side)}</td><td>${(e.files||[]).map(f=>`<a href="#" data-fid="${esc(f.id)}" data-f="1">${esc(f.name)}</a>`).join("<br>")}</td><td><button class="d" data-del="${esc(e.id)}">Delete</button></td></tr>`).join("");
}
function bindRows(t){t.onclick=e=>{if(e.target.dataset.del){del(e.target.dataset.del);return}if(e.target.dataset.f){e.preventDefault();openFile(e.target.closest("tr").dataset.id,e.target.dataset.fid);return}const r=e.target.closest("tr.c");if(r)edit(r.dataset.id)}}
const byDate=(a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0);

function filtered(){
 const r=$("fr").value;let f="0000",t="9999";
 if(r==="today")f=t=today();else if(r==="week")f=ago(6);else if(r==="month")f=ago(29);
 else if(r==="mtd")f=today().slice(0,8)+"01";else if(r==="year")f=today().slice(0,4)+"-01-01";
 else if(r==="custom"){f=$("ff").value||f;t=$("ft").value||t}
 const c=$("fc").value,p=$("fp").value,tc=$("ftc").value,q=$("fs").value.toLowerCase();
 return entries.filter(e=>e.date>=f&&e.date<=t&&(!c||e.cat===c)&&(!p||e.proc===p)&&(!tc||e.tech===tc)&&(!q||[e.name,e.dx,e.notes,e.hid,e.proc].join(" ").toLowerCase().includes(q))).sort(byDate);
}
function render(){
 if(!ready)return;
 const tl=entries.filter(e=>e.date===today()).sort(byDate);
 $("tcount").textContent=tl.length;$("ttab").innerHTML=rowsHtml(tl);bindRows($("ttab"));
 const n=(fn)=>entries.filter(fn).length,w=ago(6),m=ago(29);
 const Q=[["Today",n(e=>e.date===today()),{fr:"today"}],["Last 7 days",n(e=>e.date>=w),{fr:"week"}],["Last 30 days",n(e=>e.date>=m),{fr:"month"}],["This year",n(e=>e.date>=today().slice(0,4)+"-01-01"),{fr:"year"}],["All time",entries.length,{fr:"all"}],["Arthroscopic to date",n(e=>e.tech==="Arthroscopic"||e.cat==="Arthroscopy"),{fr:"all",fc:"Arthroscopy"}],["Robotic to date",n(e=>e.tech==="Robotic"),{fr:"all",ftc:"Robotic"}],["Robotic TKR to date",n(e=>e.tech==="Robotic"&&/TKR|Unicompartmental/.test(e.proc)),{fr:"all",ftc:"Robotic",fc:"Knee"}]];
 $("quick").innerHTML=Q.map((q,i)=>`<div class="stat" data-q="${i}"><b>${q[1]}</b><span>${q[0]}</span></div>`).join("");
 $("quick").onclick=ev=>{const s=ev.target.closest(".stat");if(!s)return;const o=Q[+s.dataset.q][2];$("fr").value=o.fr;$("fc").value=o.fc||"";fillFp();$("ftc").value=o.ftc||"";$("fs").value="";report();scrollTo({top:$("bars").offsetTop-60,behavior:"smooth"})};
 report();
}
function report(){
 document.querySelectorAll(".cu").forEach(x=>x.classList.toggle("hide",$("fr").value!=="custom"));
 const L=filtered();$("rcount").textContent=L.length;
 const grp=k=>{const o={};L.forEach(e=>o[e[k]]=(o[e[k]]||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
 const mx=Math.max(1,...grp("cat").map(x=>x[1]),...grp("proc").map(x=>x[1]));
 const bars=(t,a)=>a.length?`<div class="mu" style="margin-top:8px">${t}</div>`+a.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/mx*55}%"></i><b>${v}</b></div>`).join(""):"";
 $("bars").innerHTML=bars("By category",grp("cat"))+bars("By procedure",grp("proc"))+bars("By technique",grp("tech"));
 $("rtab").innerHTML=rowsHtml(L);bindRows($("rtab"));
}
function fillFp(){const c=$("fc").value;const a=c?CATS[c]:[...new Set(Object.values(CATS).flat())];$("fp").innerHTML=opts(a,"All procedures")}

/* ---- export ---- */
async function save(name,data,type){
 const b=data instanceof Blob?data:new Blob([data],{type});
 const P=window.Capacitor&&window.Capacitor.Plugins;
 if(P&&P.Filesystem&&P.Share){try{
  const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(b)});
  const w=await P.Filesystem.writeFile({path:name,data:b64,directory:"CACHE"});
  await P.Share.share({title:name,url:w.uri});return}catch(e){}}
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();
}
function openFile(id,fid){const e=entries.find(x=>x.id===id),f=e&&(e.files||[]).find(x=>x.id===fid);if(f&&f.blob)save(f.name,f.blob,f.blob.type)}
$("xcsv").onclick=()=>{const L=filtered();const H=["date","cat","proc","tech","side","role","name","age","sex","hid","ph","dx","notes","files"];
 const c=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 save("operative-log-"+today()+".csv",[H.join(",")].concat(L.map(e=>H.map(h=>c(h==="files"?(e.files||[]).map(f=>f.name).join("; "):e[h])).join(","))).join("\n"),"text/csv")};
$("xjson").onclick=()=>save("operative-log-backup-"+today()+".json",JSON.stringify(entries,null,1),"application/json");

/* ---- tabs & init ---- */
function tab(t){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));["add","rep","exp"].forEach(x=>$("t-"+x).classList.toggle("hide",x!==t))}
document.querySelector("nav").onclick=e=>{if(e.target.dataset.t)tab(e.target.dataset.t)};
["fr","ff","ft","fc","fp","ftc","fs"].forEach(i=>$(i).addEventListener(i==="fs"?"input":"change",()=>{if(i==="fc")fillFp();report()}));
$("cat").innerHTML=opts(Object.keys(CATS));$("tech").innerHTML=opts(TECH);
$("fc").innerHTML=opts(Object.keys(CATS),"All categories");$("ftc").innerHTML=opts(TECH,"All techniques");
fillProc();fillFp();clearForm();initStore();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
